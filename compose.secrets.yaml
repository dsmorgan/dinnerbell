# Optional: read the four secrets from files instead of .env. Add this file after compose.yaml:
#   podman-compose -f compose.yaml -f compose.secrets.yaml up -d      (or: docker compose ...)
# Without it, the secrets come from .env, where podman-compose passes them to podman as
# -e NAME=value (visible in `ps`, and printed by --dry-run and --verbose), and Dinnerbell logs a
# warning for each. With it, each secret is a file the container reads at /run/secrets/<name>,
# bind-mounted read-only, so only its path is on a command line. See "Keep secrets in files" in
# docs/setup.md. The test instance gets this file from deploy/dinnerbell-test when secrets-test/
# holds the files, with deploy/compose.test-secrets.yaml pointing it at secrets-test/.
services:
  dinnerbell:
    secrets:
      - DINNERBELL_SECRET_KEY
      - DINNERBELL_SLACK_BOT_TOKEN
      - DINNERBELL_SLACK_APP_TOKEN
      - DINNERBELL_OIDC_CLIENT_SECRET

# File secrets are bind mounts, so the host file's owner and mode apply inside the container; the
# compose uid, gid, and mode fields are ignored by Docker Compose and podman-compose. The files
# belong to the container's user (uid 10001), mode 600. Every file must exist, even an empty one
# for a Slack token you don't use, or the engine refuses to start the service.
secrets:
  DINNERBELL_SECRET_KEY:
    file: ./secrets/DINNERBELL_SECRET_KEY
  DINNERBELL_SLACK_BOT_TOKEN:
    file: ./secrets/DINNERBELL_SLACK_BOT_TOKEN
  DINNERBELL_SLACK_APP_TOKEN:
    file: ./secrets/DINNERBELL_SLACK_APP_TOKEN
  DINNERBELL_OIDC_CLIENT_SECRET:
    file: ./secrets/DINNERBELL_OIDC_CLIENT_SECRET
