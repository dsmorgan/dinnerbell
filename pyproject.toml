[project]
name = "dinnerbell"
version = "0.3.0"
description = "Self-hosted household meal coordination: who is eating, what, and who is getting it."
readme = "README.md"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.12"
authors = [{ name = "David Morgan" }]
dependencies = [
    "aiohttp>=3.14.5",
    "aiosqlite>=0.22.1",
    "alembic>=1.20.1",
    "apscheduler>=3.11,<4",
    "fastapi>=0.160.0",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "joserfc>=1.7.7",
    "pydantic>=2.14",
    "pydantic-settings>=2.16.1",
    "python-dotenv>=1.2.4",
    "python-multipart>=0.0.32",
    "pyyaml>=6.0.3",
    "slack-bolt>=1.30.0",
    "sqlalchemy[asyncio]>=2.1.6",
    "uvicorn>=0.54.0",
]

[project.scripts]
dinnerbell = "dinnerbell.main:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dinnerbell"]

[tool.hatch.build.targets.sdist]
include = ["src/dinnerbell", "README.md", "LICENSE"]

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pip-audit>=2.10.1",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.1",
    "types-pyyaml>=6.0.12.20260906",
]

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF", "ASYNC", "PT", "C4", "PIE", "RET", "N", "DTZ"]
ignore = ["N818"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "PT018"]

[tool.mypy]
strict = true
python_version = "3.12"
mypy_path = "src"
packages = ["dinnerbell"]

[[tool.mypy.overrides]]
module = ["apscheduler.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "flag(name, on): run with feature flag NAME on or off; every registered flag needs both (tests/test_flags.py)",
]
filterwarnings = [
    "error",
    "ignore::DeprecationWarning:apscheduler.*",
    # Starlette's TestClient prefers the young httpx2 fork; the app keeps the mature httpx 0.28.
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]

[tool.coverage.run]
source = ["dinnerbell"]
branch = true
concurrency = ["greenlet", "thread"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 90
