<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-labelledby="t">
  <title id="t">Dinnerbell: Dinnerbone the hamster</title>
  <defs>
    <radialGradient id="disc" cx="50%" cy="42%" r="60%">
      <stop offset="0" stop-color="#E4F3EE"/>
      <stop offset="1" stop-color="#C3E0D7"/>
    </radialGradient>
    <radialGradient id="fur" cx="50%" cy="38%" r="65%">
      <stop offset="0" stop-color="#E3A35A"/>
      <stop offset="1" stop-color="#C98237"/>
    </radialGradient>
    <clipPath id="inner"><circle cx="256" cy="256" r="196"/></clipPath>
    <clipPath id="bodyclip"><ellipse cx="256" cy="452" rx="178" ry="128"/></clipPath>
    <path id="rimTop" d="M 44 256 A 212 212 0 0 1 468 256"/>
  </defs>

  <!-- badge ring -->
  <circle cx="256" cy="256" r="250" fill="#5B3A21" stroke="#D9954A" stroke-width="4"/>
  <circle cx="256" cy="256" r="240" fill="none" stroke="#F3D9A4" stroke-width="2.5" opacity=".55"/>
  <circle cx="256" cy="256" r="200" fill="#F3D9A4"/>
  <circle cx="256" cy="256" r="196" fill="url(#disc)"/>

  <!-- rim text -->
  <text font-family="ui-rounded, 'SF Pro Rounded', system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="38" font-weight="800" letter-spacing="7" fill="#F8E2B4">
    <textPath href="#rimTop" startOffset="50%" text-anchor="middle">DINNERBELL</textPath>
  </text>
  <!-- rim ornaments: stars at 9 and 3 o'clock, bell at 6 -->
  <g fill="#F8E2B4">
    <path d="M28 256 l5-3 3-6 3 6 5 3-5 3-3 6-3-6z" transform="translate(-2 0)"/>
    <path d="M468 256 l5-3 3-6 3 6 5 3-5 3-3 6-3-6z" transform="translate(2 0)"/>
    <g transform="translate(256 480)">
      <path d="M-13 6 C-13 -4 -9 -13 0 -14 C9 -13 13 -4 13 6 L16 9 L-16 9 Z"/>
      <circle cx="0" cy="12" r="3.6"/>
      <circle cx="0" cy="-16" r="2.6"/>
    </g>
    <circle cx="200" cy="476" r="3"/>
    <circle cx="312" cy="476" r="3"/>
  </g>

  <g clip-path="url(#inner)">
    <!-- shoulders / body -->
    <ellipse cx="256" cy="452" rx="178" ry="128" fill="#C98237"/>
    <ellipse cx="256" cy="478" rx="88" ry="90" fill="#FBE7C6"/>
  </g>

  <!-- ears -->
  <g>
    <circle cx="160" cy="128" r="40" fill="#C98237"/>
    <circle cx="352" cy="128" r="40" fill="#C98237"/>
    <circle cx="164" cy="132" r="24" fill="#F3A7AE"/>
    <circle cx="348" cy="132" r="24" fill="#F3A7AE"/>
  </g>

  <!-- head -->
  <path d="M256 110 C330 110 380 150 390 208 C410 222 420 258 408 292 C394 334 336 362 256 362 C176 362 118 334 104 292 C92 258 102 222 122 208 C132 150 182 110 256 110 Z" fill="url(#fur)"/>
  <!-- darker forehead stripe -->
  <path d="M256 112 C244 112 238 136 242 168 C246 182 266 182 270 168 C274 136 268 112 256 112 Z" fill="#B87430" opacity=".28"/>

  <!-- cream cheeks and muzzle -->
  <path d="M120 262 C122 232 160 222 190 236 C214 228 240 238 256 250 C272 238 298 228 322 236 C352 222 390 232 392 262 C394 310 350 346 300 350 C284 356 270 358 256 358 C242 358 228 356 212 350 C162 346 118 310 120 262 Z" fill="#FBE7C6"/>

  <!-- blush -->
  <ellipse cx="160" cy="292" rx="22" ry="12" fill="#F29AA4" opacity=".55"/>
  <ellipse cx="352" cy="292" rx="22" ry="12" fill="#F29AA4" opacity=".55"/>

  <!-- eyes -->
  <g>
    <circle cx="200" cy="222" r="22" fill="#2A1910"/>
    <circle cx="312" cy="222" r="22" fill="#2A1910"/>
    <circle cx="192" cy="213" r="8" fill="#fff"/>
    <circle cx="304" cy="213" r="8" fill="#fff"/>
    <circle cx="207" cy="231" r="3.5" fill="#fff" opacity=".85"/>
    <circle cx="319" cy="231" r="3.5" fill="#fff" opacity=".85"/>
  </g>

  <!-- whiskers -->
  <g stroke="#7A4A2A" stroke-width="2.4" stroke-linecap="round" fill="none" opacity=".7">
    <path d="M196 280 Q150 268 104 270"/>
    <path d="M196 290 Q150 290 102 298"/>
    <path d="M198 300 Q156 310 112 326"/>
    <path d="M316 280 Q362 268 408 270"/>
    <path d="M316 290 Q362 290 410 298"/>
    <path d="M314 300 Q356 310 400 326"/>
  </g>

  <!-- teeth -->
  <path d="M248 296 h16 v12 a4 4 0 0 1 -4 4 h-8 a4 4 0 0 1 -4 -4 z" fill="#FFFFFF" stroke="#D9C3A0" stroke-width="1.5"/>
  <path d="M256 297 v14" stroke="#D9C3A0" stroke-width="1.5"/>
  <!-- nose and mouth -->
  <path d="M241 262 Q256 254 271 262 Q269 278 256 283 Q243 278 241 262 Z" fill="#E77F8C"/>
  <ellipse cx="251" cy="263" rx="4" ry="2.4" fill="#fff" opacity=".6"/>
  <g stroke="#7A4A2A" stroke-width="3.5" stroke-linecap="round" fill="none">
    <path d="M256 283 V294"/>
    <path d="M256 294 Q246 304 234 297"/>
    <path d="M256 294 Q266 304 278 297"/>
  </g>

  <!-- collar -->
  <g clip-path="url(#bodyclip)">
    <path d="M100 330 Q256 404 412 330 L416 358 Q256 432 96 358 Z" fill="#C8423B"/>
    <path d="M98 345 Q256 419 414 345" fill="none" stroke="#E8746B" stroke-width="3" opacity=".7"/>
  </g>
  <!-- tag ring -->
  <circle cx="256" cy="402" r="8" fill="none" stroke="#A87A22" stroke-width="4"/>

  <!-- bone-shaped name tag -->
  <g>
    <g fill="#EDBE55" stroke="#A87A22" stroke-width="3">
      <circle cx="176" cy="414" r="14"/>
      <circle cx="176" cy="440" r="14"/>
      <circle cx="336" cy="414" r="14"/>
      <circle cx="336" cy="440" r="14"/>
      <rect x="174" y="408" width="164" height="38" rx="8"/>
    </g>
    <!-- cover inner strokes where shaft meets knobs -->
    <rect x="172" y="410" width="168" height="34" rx="6" fill="#EDBE55"/>
    <text x="256" y="434" text-anchor="middle" font-family="ui-rounded, 'SF Pro Rounded', system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="800" letter-spacing="1.5" fill="#5B3A21">DINNERBONE</text>
  </g>
</svg>
