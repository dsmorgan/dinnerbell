  <ellipse cx="362" cy="296" rx="30" ry="17" fill="#F4A0A0" opacity="0.6"/>
  <!-- eyes -->
  <circle cx="190" cy="226" r="26" fill="#2A1810"/>
  <circle cx="322" cy="226" r="26" fill="#2A1810"/>
  <circle cx="181" cy="216" r="9" fill="#FFFFFF"/>
  <circle cx="313" cy="216" r="9" fill="#FFFFFF"/>
  <circle cx="198" cy="236" r="4" fill="#FFFFFF" opacity="0.8"/>
  <circle cx="330" cy="236" r="4" fill="#FFFFFF" opacity="0.8"/>
