  <path d="M240 268 Q256 260 272 268 Q268 284 256 288 Q244 284 240 268 Z" fill="#E97C8A"/>
  <rect x="246.5" y="305" width="19" height="15" rx="4" fill="#FFFFFF" stroke="#7A4A2A" stroke-width="3"/>
