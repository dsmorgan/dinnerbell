  <!-- bone-shaped name tag -->
  <g fill="#F5C64B">
    <rect x="154" y="428" width="204" height="42" rx="10"/>
    <circle cx="154" cy="436" r="16"/>
    <circle cx="154" cy="462" r="16"/>
    <circle cx="358" cy="436" r="16"/>
    <circle cx="358" cy="462" r="16"/>
