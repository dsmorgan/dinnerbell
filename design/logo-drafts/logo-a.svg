  <text x="256" y="458" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="24" font-weight="800" letter-spacing="1.5" fill="#6B3E1E">DINNERBONE</text>
