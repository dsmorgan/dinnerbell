  <ellipse cx="366" cy="292" rx="78" ry="78" fill="#D18A3C"/>
  <ellipse cx="256" cy="238" rx="164" ry="140" fill="url(#fur)"/>
  <!-- cream lower face -->
  <path d="M86 300 C90 250 150 240 200 262 Q256 248 312 262 C362 240 422 250 426 300 C428 360 360 392 256 392 C152 392 84 360 86 300 Z" fill="#FBE8CC"/>
