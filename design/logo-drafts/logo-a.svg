  </defs>
  <!-- backdrop -->
  <circle cx="256" cy="256" r="252" fill="#FFF3E0"/>
  <circle cx="256" cy="256" r="244" fill="#2E6B6F"/>
  <g clip-path="url(#disc)">
    <circle cx="256" cy="256" r="196" fill="#367A7E"/>
    <!-- shoulders -->
    <ellipse cx="256" cy="520" rx="210" ry="150" fill="#B9712F"/>
    <ellipse cx="256" cy="530" rx="110" ry="120" fill="#F7DDB6"/>
  </g>
  <!-- ears -->
  <circle cx="150" cy="134" r="44" fill="#C27A34"/>
  <circle cx="362" cy="134" r="44" fill="#C27A34"/>
  <circle cx="153" cy="138" r="26" fill="#F2A3A6"/>
