# Alembic configuration for authoring migrations only. Dinnerbell runs migrations itself at
# startup (`dinnerbell serve` and `dinnerbell migrate`); see CLAUDE.md for the workflow.
[alembic]
script_location = src/dinnerbell/db/alembic
file_template = %%(rev)s_%%(slug)s
sqlalchemy.url = sqlite:///./migrations-scratch.db
