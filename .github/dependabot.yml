# One grouped PR per ecosystem each Monday, and a separate grouped PR for security fixes
# to Python packages and actions.
# Cooldown skips releases younger than a week; GitHub never applies it to security updates.
# Nothing auto-merges: every Dependabot PR goes through review and the required checks.
version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    groups:
      python-security:
        applies-to: security-updates
        patterns: ["*"]
      python:
        applies-to: version-updates
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    groups:
      actions-security:
        applies-to: security-updates
        patterns: ["*"]
      actions:
        applies-to: version-updates
        patterns: ["*"]

  # Bumps the Containerfile's base images, including the uv image that sets CI's uv version.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    # No security group: GitHub publishes no advisories for container images, so Dependabot
    # never opens a security update here. Grype in CI and the nightly scan cover the image.
    groups:
      docker:
        applies-to: version-updates
        patterns: ["*"]
