# SPDX-License-Identifier: AGPL-3.0-or-later
# Scan the released image every night. A fixable HIGH or CRITICAL finding turns the run red,
# which is the signal to cut a patch release (docs/hardening.md).
name: Scan release image

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: scan-release
  cancel-in-progress: false

jobs:
  scan:
    name: Grype scan of :latest
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read # list releases; checkout
      security-events: write # upload SARIF
    env:
      IMAGE: ghcr.io/${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Find the newest release, then check that :latest is that release's image, by its
      # org.opencontainers.image.version label. Before the first release there's nothing to scan,
      # and the run says so. After it, a missing, unreadable or stale :latest is an error.
      # The registry is read anonymously, so the GHCR package must be public.
      - name: Resolve the image digest
        id: image
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! tag=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name 2>release.err); then
            if grep -q "HTTP 404" release.err; then
              echo "found=false" >> "$GITHUB_OUTPUT"
              echo "::notice::No release yet, so there's no $IMAGE:latest to scan."
              echo "No release yet, so there's no \`$IMAGE:latest\` to scan." >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            cat release.err
            exit 1
          fi

          name=${IMAGE#ghcr.io/}
          token=$(curl -fsS --retry 3 "https://ghcr.io/token?scope=repository:$name:pull" | jq -r '.token // empty') || token=""
          if [ -z "$token" ]; then
            echo "::error::Release $tag exists, but $IMAGE can't be read anonymously: the GHCR package is private or doesn't exist."
            exit 1
          fi
          accept="application/vnd.oci.image.index.v1+json,application/vnd.docker.distribution.manifest.list.v2+json,application/vnd.oci.image.manifest.v1+json,application/vnd.docker.distribution.manifest.v2+json"
          registry() {
            curl -fsSL --retry 3 -H "Authorization: Bearer $token" -H "Accept: $accept" "$@"
          }
          if ! registry -D headers.txt -o index.json "https://ghcr.io/v2/$name/manifests/latest"; then
            echo "::error::Release $tag exists, but $IMAGE:latest doesn't. Check that the release's publish job pushed it."
            exit 1
          fi
          digest=$(tr -d '\r' < headers.txt | awk 'tolower($1) == "docker-content-digest:" { print $2 }' | tail -n 1)
          if ! [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::Can't read the digest of $IMAGE:latest."
            exit 1
          fi

          # An index lists one manifest per platform plus attestations; the image is linux/amd64.
          manifest=$(jq -r 'if .manifests then (.manifests[] | select(.platform.os == "linux" and .platform.architecture == "amd64") | .digest) else empty end' index.json | head -n 1)
          if [ -n "$manifest" ]; then
            if ! [[ "$manifest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
              echo "::error::$IMAGE:latest lists an unexpected amd64 manifest digest."
              exit 1
            fi
            registry -o manifest.json "https://ghcr.io/v2/$name/manifests/$manifest"
          else
            cp index.json manifest.json
          fi
          config=$(jq -r .config.digest manifest.json)
          if ! [[ "$config" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::$IMAGE:latest has an unexpected config digest."
            exit 1
          fi
          version=$(registry "https://ghcr.io/v2/$name/blobs/$config" | jq -r '.config.Labels["org.opencontainers.image.version"] // ""' | tr -cd '0-9A-Za-z.+-')
          if [ "$version" != "${tag#v}" ]; then
            echo "::error::$IMAGE:latest is version '$version', but the newest release is $tag. Check that the release's publish job pushed :latest."
            exit 1
          fi

          echo "ref=$IMAGE@$digest" >> "$GITHUB_OUTPUT"
          echo "found=true" >> "$GITHUB_OUTPUT"
          echo "Scanning \`$IMAGE:latest\` ($tag) at \`$digest\`." >> "$GITHUB_STEP_SUMMARY"

      - name: Scan
        id: scan
        if: steps.image.outputs.found == 'true'
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          image: ${{ steps.image.outputs.ref }}
          only-fixed: true
          severity-cutoff: high
          fail-build: true
          output-format: sarif

      - name: Upload SARIF
        if: ${{ !cancelled() && steps.image.outputs.found == 'true' && steps.scan.outputs.sarif != '' }}
        uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          sarif_file: ${{ steps.scan.outputs.sarif }}
          category: grype-release
