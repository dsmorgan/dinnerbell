# SPDX-License-Identifier: AGPL-3.0-or-later
# One workflow on purpose: `needs:` works only inside a workflow, and a red build must never
# publish. `check` and `image` run everywhere; `publish` runs only after both pass, on a push to
# main, a vX.Y.Z tag, or a manual run on main; `scan-published` then scans the pushed digest.
# On a release tag, `release-bundle` then attests the install bundle and keeps it as an artifact.
# `check` itself only gathers `lint` and the eight `test` shards, which run in parallel.
name: CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

# One run at a time per ref, in push order, so :main always ends at the newest commit. Only pull
# requests cancel a run in progress. Tags never share a group. GitHub keeps one pending run per
# group, so if a third push lands on main while one run is in progress and another is waiting, the
# waiting run is dropped and its <sha7> tag is never published.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE: ghcr.io/dsmorgan/dinnerbell

jobs:
  # `check` is the one required status check for the code, so it stays a single job that gates
  # `publish`. The work runs in `lint` and the `test` shards, in parallel, and `check` fails
  # unless every one of them passed and the merged coverage clears the floor.
  lint:
    name: lint
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The Containerfile's uv image is the one source for the uv version. Dependabot's docker
      # updater bumps its tag and digest together, and CI follows without a second pin to drift.
      - name: Read the uv version from the Containerfile
        id: uv
        run: |
          version=$(sed -n 's|^FROM ghcr\.io/astral-sh/uv:\([0-9][0-9.]*\)@sha256:.*|\1|p' Containerfile)
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error file=Containerfile::Can't read the uv version from the FROM ghcr.io/astral-sh/uv line."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: ${{ steps.uv.outputs.version }}
          python-version: "3.12"
          # auto: cache everywhere except tag pushes, so a release never restores a cache.
          enable-cache: auto
      - name: Install
        run: uv sync --locked
      - name: Check the tag matches the package version
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(uv run python -c 'import dinnerbell; print(dinnerbell.__version__)')
          if [[ "$TAG" != "v$version" ]]; then
            echo "::error::Tag $TAG doesn't match dinnerbell.__version__ ($version). Bump the version first."
            exit 1
          fi
      - name: Ruff lint
        run: uv run ruff check .
      - name: Ruff format
        run: uv run ruff format --check .
      - name: Mypy (strict)
        run: uv run mypy
      - name: pip-audit
        run: |
          uv export --frozen --all-groups --format requirements-txt --no-emit-project -o "$RUNNER_TEMP/requirements.txt"
          uv run pip-audit --strict --require-hashes --disable-pip -r "$RUNNER_TEMP/requirements.txt"

  # The suite split eight ways. tests/support/shard.py gives each shard about an eighth of the test
  # files, by size, and a shard imports only its own files: under coverage the imports are a large
  # part of a short run. Each shard runs one pytest worker per vCPU (4 on GitHub's runners) and
  # saves its coverage data. `check` merges the eight and enforces the floor, which no shard can.
  test:
    name: test (${{ matrix.shard }}/8)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    env:
      COVERAGE_FILE: coverage-shard-${{ matrix.shard }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Read the uv version from the Containerfile
        id: uv
        run: |
          version=$(sed -n 's|^FROM ghcr\.io/astral-sh/uv:\([0-9][0-9.]*\)@sha256:.*|\1|p' Containerfile)
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error file=Containerfile::Can't read the uv version from the FROM ghcr.io/astral-sh/uv line."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: ${{ steps.uv.outputs.version }}
          python-version: "3.12"
          enable-cache: auto
      - name: Install
        run: uv sync --locked
      # The slowest tests are listed so a regression in test time shows up in the log.
      - name: Pytest with coverage
        run: |
          mapfile -t files < <(uv run python -m tests.support.shard "${{ matrix.shard }}/8")
          test "${#files[@]}" -gt 0 # with no files, pytest would run the whole suite
          uv run pytest -n auto --cov --cov-report= --cov-fail-under=0 --durations=20 "${files[@]}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-shard-${{ matrix.shard }}
          path: coverage-shard-${{ matrix.shard }}
          if-no-files-found: error
          retention-days: 1
          overwrite: true # a re-run of one shard replaces that shard's file, and only that one

  check:
    name: check
    needs: [lint, test]
    # Run even when a needed job failed or the run was cancelled, so that `check` fails. A skipped
    # job counts as passing for a required status check. The first step fails on any result but
    # `success`, and a cancelled one is `cancelled`.
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Fail unless lint and every test shard passed
        env:
          LINT: ${{ needs.lint.result }}
          TEST: ${{ needs.test.result }}
        run: |
          if [[ "$LINT" != success || "$TEST" != success ]]; then
            echo "::error::lint was '$LINT' and test was '$TEST'; both must be 'success'."
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Read the uv version from the Containerfile
        id: uv
        run: |
          version=$(sed -n 's|^FROM ghcr\.io/astral-sh/uv:\([0-9][0-9.]*\)@sha256:.*|\1|p' Containerfile)
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error file=Containerfile::Can't read the uv version from the FROM ghcr.io/astral-sh/uv line."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: ${{ steps.uv.outputs.version }}
          python-version: "3.12"
          enable-cache: auto
      - name: Install
        run: uv sync --locked
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: coverage-shard-*
          path: shards
          merge-multiple: true
      # coverage reads fail_under (90) from pyproject.toml. Before it runs, every one of the eight
      # files must exist, differ from the others (a duplicate is a shard counted twice), hold measured
      # files (not empty), and be combined, not skipped (a damaged file is skipped).
      - name: Merge the coverage data and enforce the floor
        run: |
          test "$(find shards -type f | wc -l)" -eq 8
          if [[ -n "$(sha256sum shards/* | cut -d' ' -f1 | sort | uniq -d)" ]]; then
            echo "::error::Two shards saved identical coverage data."
            exit 1
          fi
          # coverage combines an empty file without complaint, so look inside each one.
          for file in shards/*; do
            uv run python -c 'import sqlite3, sys; sys.exit(0 if sqlite3.connect(sys.argv[1]).execute("select count(*) from file").fetchone()[0] else 1)' "$file" || {
              echo "::error::$file holds no coverage data."
              exit 1
            }
          done
          uv run coverage combine shards/* 2>&1 | tee combine.log
          if grep -qi skipped combine.log || ! grep -qx "Combined 8 files" combine.log; then
            echo "::error::coverage combine didn't use all eight shard files."
            exit 1
          fi
          uv run coverage report

  image:
    name: image
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write # upload the Grype SARIF to Code scanning
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Choose the build stamp
        id: stamp
        env:
          REF: ${{ github.ref }}
          SHA: ${{ github.sha }}
        run: |
          # Release images show the bare version; every other build shows version+<sha7>.
          if [[ "$REF" == refs/tags/v* ]]; then build=""; else build="${SHA:0:7}"; fi
          echo "build=$build" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      # Tag builds start from scratch. Other builds share the GitHub Actions cache with `publish`,
      # so a main build publishes the same layers this job smoke-tested and scanned.
      - name: Build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Containerfile
          platforms: linux/amd64
          build-args: DINNERBELL_BUILD=${{ steps.stamp.outputs.build }}
          tags: dinnerbell:ci
          load: true
          push: false
          provenance: false
          sbom: false
          no-cache: ${{ startsWith(github.ref, 'refs/tags/') }}
          cache-from: ${{ !startsWith(github.ref, 'refs/tags/') && 'type=gha' || '' }}
          cache-to: ${{ !startsWith(github.ref, 'refs/tags/') && 'type=gha,mode=max' || '' }}
      - name: Smoke test
        run: |
          docker run --detach --name smoke --read-only --tmpfs /tmp:size=16m --cap-drop ALL \
            --security-opt no-new-privileges:true --publish 8013:8013 \
            --env DINNERBELL_BASE_URL=http://localhost:8013 \
            --env DINNERBELL_SECRET_KEY=ci-only-secret-key-not-used-anywhere-else \
            --env DINNERBELL_ADMIN_EMAIL=admin@example.com \
            --env DINNERBELL_OIDC_ISSUER=https://idp.example.com \
            --env DINNERBELL_OIDC_CLIENT_ID=ci \
            --env DINNERBELL_OIDC_CLIENT_SECRET=ci \
            dinnerbell:ci
          for _ in $(seq 1 30); do
            if curl --silent --fail http://localhost:8013/healthz; then exit 0; fi
            sleep 1
          done
          docker logs smoke
          exit 1
      - name: Check the build stamp
        env:
          BUILD: ${{ steps.stamp.outputs.build }}
        run: |
          version=$(curl --silent --fail http://localhost:8013/healthz | jq --raw-output .version)
          echo "The image reports version $version"
          if [[ -n "$BUILD" && "$version" != *"+$BUILD" ]] || [[ -z "$BUILD" && "$version" == *+* ]]; then
            echo "::error::Expected the build stamp '$BUILD', but /healthz reports version '$version'."
            exit 1
          fi
      - name: Scan with Grype
        id: scan
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          image: dinnerbell:ci
          only-fixed: true
          severity-cutoff: high
          fail-build: true
          output-format: sarif
      # Upload even when the scan fails, so the findings show under Code scanning. A pull request
      # from a fork gets a read-only token and can't upload; its scan result still gates the job.
      - name: Upload the scan to Code scanning
        if: >-
          ${{ !cancelled() && steps.scan.outputs.sarif != '' &&
          (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
        uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          sarif_file: ${{ steps.scan.outputs.sarif }}
          category: grype

  publish:
    name: publish
    needs: [check, image]
    # Never on pull requests or forks. A manual run publishes only from main: rebuilding a release
    # tag would replace an X.Y.Z image that people already pinned and verified.
    if: >-
      github.repository == 'dsmorgan/dinnerbell' &&
      (github.event_name == 'push' ||
       (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'))
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write # push to GHCR
      id-token: write # Sigstore signing certificate for the attestations
      attestations: write # store the attestations
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # the release check needs main's history
      # A release must be vX.Y.Z on a commit that is already on main. A main build moves `main`
      # only while its commit is still main's head, so re-running an old run can't roll it back.
      - name: Check what this run may publish
        id: guard
        env:
          REF: ${{ github.ref }}
          REF_NAME: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
        run: |
          if [[ "$REF" == refs/tags/* ]]; then
            if ! [[ "$REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::Release tags must be vX.Y.Z with no suffix; $REF_NAME isn't."
              exit 1
            fi
            if ! git merge-base --is-ancestor "$SHA" origin/main; then
              echo "::error::$REF_NAME points at $SHA, which isn't on main. Tag a commit on main."
              exit 1
            fi
            {
              echo "version=${REF_NAME#v}"
              echo "build="
              echo "newest-main=false"
            } >> "$GITHUB_OUTPUT"
          else
            head=$(git ls-remote origin refs/heads/main | cut -f1)
            if ! [[ "$head" =~ ^[0-9a-f]{40}$ ]]; then
              echo "::error::Can't read main's current commit."
              exit 1
            fi
            newest=false
            if [[ "$head" == "$SHA" ]]; then newest=true; else
              echo "::notice::main has moved on to $head, so this run publishes only ${SHA:0:7}, not main."
            fi
            {
              echo "version="
              echo "build=${SHA:0:7}"
              echo "newest-main=$newest"
            } >> "$GITHUB_OUTPUT"
          fi
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Release digests never change: what people verified and pinned stays what they pull.
      - name: Refuse to replace a published release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          VERSION: ${{ steps.guard.outputs.version }}
        run: |
          if out=$(docker buildx imagetools inspect "$IMAGE:$VERSION" 2>&1); then
            echo "::error::$IMAGE:$VERSION already exists, and a release digest must never change. Release a new patch version instead."
            exit 1
          fi
          if [[ "$out" != *": not found"* ]]; then
            echo "::error::Can't confirm that $IMAGE:$VERSION is unpublished: $out"
            exit 1
          fi
      # main publishes `main` and `<sha7>`; vX.Y.Z publishes `X.Y.Z`, `X.Y` and `latest`.
      - name: Image tags and labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=false
          tags: |
            type=raw,value=main,enable=${{ github.ref == 'refs/heads/main' && steps.guard.outputs.newest-main == 'true' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=,format=short,enable=${{ !startsWith(github.ref, 'refs/tags/') }}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
          # Keep the Containerfile's values; the repository metadata would say AGPL-3.0.
          labels: |
            org.opencontainers.image.title=Dinnerbell
            org.opencontainers.image.description=Household meal coordination
            org.opencontainers.image.licenses=AGPL-3.0-or-later
          annotations: |
            org.opencontainers.image.title=Dinnerbell
            org.opencontainers.image.description=Household meal coordination
            org.opencontainers.image.licenses=AGPL-3.0-or-later
      - name: Build and push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Containerfile
          platforms: linux/amd64
          build-args: DINNERBELL_BUILD=${{ steps.guard.outputs.build }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          push: true
          provenance: mode=max
          sbom: true
          no-cache: ${{ startsWith(github.ref, 'refs/tags/') }}
          cache-from: ${{ !startsWith(github.ref, 'refs/tags/') && 'type=gha' || '' }}
      # BuildKit's SBOM sits in the image index unsigned. Sign that same document, rather than
      # running another tool in this job with its write tokens.
      - name: Extract BuildKit's SBOM
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          docker buildx imagetools inspect "$IMAGE@$DIGEST" --format '{{ json .SBOM }}' > "$RUNNER_TEMP/sbom-index.json"
          # A single-platform index has the SBOM at .SPDX; a multi-platform one keys it by platform.
          jq 'if has("SPDX") then .SPDX else .["linux/amd64"].SPDX end' \
            "$RUNNER_TEMP/sbom-index.json" > "$RUNNER_TEMP/sbom.spdx.json"
          if ! jq --exit-status '(.spdxVersion | startswith("SPDX-")) and (.packages | length > 0)' \
            "$RUNNER_TEMP/sbom.spdx.json" > /dev/null; then
            echo "::error::The pushed image has no linux/amd64 SPDX SBOM."
            exit 1
          fi
      # actions/attest replaces actions/attest-build-provenance and actions/attest-sbom, which
      # are now thin wrappers around it. No storage record, so no artifact-metadata permission.
      - name: Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
          create-storage-record: false
      - name: Attest the SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          sbom-path: ${{ runner.temp }}/sbom.spdx.json
          push-to-registry: true
          create-storage-record: false
      - name: Record the digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
          VERSION: ${{ steps.guard.outputs.version }}
        run: |
          if [[ -n "$VERSION" ]]; then subject="${IMAGE}:${VERSION}"; else subject="${IMAGE}@${DIGEST}"; fi
          {
            echo "### Published ${IMAGE}"
            echo
            echo "Digest: \`${DIGEST}\`"
            echo
            echo "Tags:"
            echo
            while read -r tag; do [[ -n "$tag" ]] && echo "- \`${tag}\`"; done <<< "$TAGS"
            echo
            echo "Verify with:"
            echo
            echo "\`\`\`sh"
            echo "gh attestation verify oci://${subject} --repo dsmorgan/dinnerbell \\"
            echo "  --signer-workflow dsmorgan/dinnerbell/.github/workflows/ci.yml --source-ref ${GITHUB_REF}"
            echo "\`\`\`"
          } >> "$GITHUB_STEP_SUMMARY"

  # Scans the exact pushed digest. It runs apart from publish so the scanner never holds the
  # tokens that can push images or sign attestations.
  scan-published:
    name: scan-published
    needs: publish
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read # pull the image while the package is private
      security-events: write # upload the Grype SARIF to Code scanning
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Scan the pushed image with Grype
        id: scan
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          image: ${{ env.IMAGE }}@${{ needs.publish.outputs.digest }}
          only-fixed: true
          severity-cutoff: high
          fail-build: true
          output-format: sarif
      - name: Upload the scan to Code scanning
        if: ${{ !cancelled() && steps.scan.outputs.sarif != '' }}
        uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          sarif_file: ${{ steps.scan.outputs.sarif }}
          category: grype-published

  compose:
    name: compose
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Ubuntu 24.04 ships podman-compose 1.0.6, the oldest version the docs support. Its merge
      # and .env rules differ from Docker's, so the checks run against both.
      - name: Install podman-compose
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q podman-compose
      - name: Shellcheck
        run: shellcheck deploy/dinnerbell-test deploy/check-secrets scripts/check-compose.sh scripts/build-bundle.sh
      # The install bundle (docs/install.md), built on every run so the script stays exercised. Two
      # builds of one commit must be byte for byte the same. `release-bundle` builds the release's.
      - name: Build the install bundle
        run: |
          scripts/build-bundle.sh "$RUNNER_TEMP/bundle-1"
          scripts/build-bundle.sh "$RUNNER_TEMP/bundle-2"
          cmp "$RUNNER_TEMP"/bundle-1/dinnerbell-*.tar.gz "$RUNNER_TEMP"/bundle-2/dinnerbell-*.tar.gz
          (cd "$RUNNER_TEMP/bundle-1" && sha256sum --check --strict ./*.sha256)
          tar --list --verbose --gzip --file "$RUNNER_TEMP"/bundle-1/dinnerbell-*.tar.gz
      # check-compose.sh runs `dinnerbell config check` from this checkout in place of the image.
      - name: Read the uv version from the Containerfile
        id: uv
        run: |
          version=$(sed -n 's|^FROM ghcr\.io/astral-sh/uv:\([0-9][0-9.]*\)@sha256:.*|\1|p' Containerfile)
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error file=Containerfile::Can't read the uv version from the FROM ghcr.io/astral-sh/uv line."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: ${{ steps.uv.outputs.version }}
          python-version: "3.12"
          enable-cache: auto
      - name: Install
        run: uv sync --locked
      # Renders both instances from the example env files, checks volume names, tags, and ports,
      # and checks that the test wrapper refuses unsafe setups and runs its configuration check.
      - name: Check compose files
        run: scripts/check-compose.sh

  # The install bundle for a release tag: built from the tagged commit, attested like the image, and
  # kept as a workflow artifact. Releases are immutable and are created by hand after this run passes,
  # so the release recipe in CONTRIBUTING.md downloads it, verifies it, and attaches it then. Nothing
  # here writes to the release. `needs: publish` keeps it to a tag that `publish` accepted.
  release-bundle:
    name: release-bundle
    needs: [publish, compose]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write # Sigstore signing certificate for the attestation
      attestations: write # store the attestation
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build the install bundle
        id: bundle
        env:
          TAG: ${{ github.ref_name }}
        run: |
          scripts/build-bundle.sh dist
          name="dinnerbell-${TAG#v}"
          if [[ ! -f "dist/$name.tar.gz" ]]; then
            echo "::error::The bundle isn't named for $TAG: $(ls dist)"
            exit 1
          fi
          echo "name=$name" >> "$GITHUB_OUTPUT"
      - name: Attest the bundle
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/${{ steps.bundle.outputs.name }}.tar.gz
          create-storage-record: false
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.bundle.outputs.name }}
          path: |
            dist/${{ steps.bundle.outputs.name }}.tar.gz
            dist/${{ steps.bundle.outputs.name }}.tar.gz.sha256
          if-no-files-found: error
      - name: Record the bundle
        env:
          NAME: ${{ steps.bundle.outputs.name }}
        run: |
          {
            echo "### Install bundle"
            echo
            echo "Artifact \`${NAME}\`: \`$(cat "dist/${NAME}.tar.gz.sha256")\`"
            echo
            echo "Attach it to the release as in the release recipe in CONTRIBUTING.md."
          } >> "$GITHUB_STEP_SUMMARY"
