# SPDX-License-Identifier: AGPL-3.0-or-later
# OpenSSF Scorecard. Treat the score as a checklist, not a target.
# publish_results makes the Scorecard API check this workflow: no top-level env, defaults or
# write permissions; id-token only in this job; only the approved actions below in this job.
name: Scorecard

on:
  push:
    branches: [main]
  schedule:
    - cron: "41 7 * * 1"
  workflow_dispatch:

permissions: {}

concurrency:
  group: scorecard
  cancel-in-progress: true

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read # checkout
      security-events: write # upload SARIF to code scanning
      id-token: write # sign the published results
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run analysis
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scorecard-sarif
          path: results.sarif
          retention-days: 5

      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          sarif_file: results.sarif
          category: scorecard
