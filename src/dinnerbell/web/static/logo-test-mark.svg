      <circle cx="146" cy="292" r="78" fill="#D18A3C"/>
      <circle cx="366" cy="292" r="78" fill="#D18A3C"/>
      <ellipse cx="256" cy="238" rx="164" ry="140" fill="#E0994C"/>
