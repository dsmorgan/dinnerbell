<!-- Dinnerbot small mark: the face from logo-test.svg, simplified for 16 px and 32 px. It drops
     the grid, the dimension line, and the tag, and thickens the outlines and the ring. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="t">
  <title id="t">Dinnerbot, the Dinnerbell test mascot</title>
  <defs>
    <clipPath id="disc"><circle cx="256" cy="256" r="226"/></clipPath>
    <clipPath id="head">
      <ellipse cx="256" cy="238" rx="164" ry="140"/>
      <circle cx="366" cy="292" r="78"/>
      <path d="M86 300 C90 250 150 240 200 262 Q256 248 312 262 C362 240 422 250 426 300 C428 360 360 392 256 392 C152 392 84 360 86 300 Z"/>
    </clipPath>
  </defs>
  <circle cx="256" cy="256" r="256" fill="#EAF4FF"/>
  <circle cx="256" cy="256" r="226" fill="#1B4A86"/>
  <g clip-path="url(#disc)">
    <g transform="translate(256 262) scale(1.12) translate(-256 -250)">
      <!-- shoulders, ears, and head in white outline on blue -->
      <g fill="#1E5394" stroke="#F4FAFF" stroke-width="12">
        <ellipse cx="256" cy="470" rx="230" ry="120"/>
        <circle cx="146" cy="138" r="46"/>
        <circle cx="366" cy="138" r="46"/>
        <circle cx="146" cy="292" r="78"/>
        <circle cx="366" cy="292" r="78"/>
        <ellipse cx="256" cy="238" rx="164" ry="140"/>
      </g>
      <path d="M86 300 C90 250 150 240 200 262 Q256 248 312 262 C362 240 422 250 426 300 C428 360 360 392 256 392 C152 392 84 360 86 300 Z" fill="#22599E" stroke="#F4FAFF" stroke-width="12"/>
      <!-- the unfinished right half, from the exact center line -->
      <g clip-path="url(#head)">
        <rect x="256" y="90" width="210" height="320" fill="#0F2E57"/>
      </g>
      <path d="M256 92 V392" stroke="#F4FAFF" stroke-width="10" stroke-dasharray="24 14"/>
      <!-- eyes: Dinnerbone's on the left, the cyan robot eye on the right -->
      <circle cx="188" cy="222" r="34" fill="#F4FAFF"/>
      <circle cx="188" cy="222" r="14" fill="#1B4A86"/>
      <circle cx="326" cy="222" r="36" fill="#0F2E57" stroke="#F4FAFF" stroke-width="10"/>
      <circle cx="326" cy="222" r="20" fill="#3FE0E8"/>
      <!-- nose and mouth -->
      <path d="M234 266 Q256 254 278 266 Q272 288 256 294 Q240 288 234 266 Z" fill="#F4FAFF"/>
      <path d="M256 294 L256 308 M256 308 Q244 324 228 312 M256 308 Q268 324 284 312" fill="none" stroke="#F4FAFF" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>
</svg>
