{#- Feedback on one catalog item: only how many loved it (FR-49). No other rating and no issue
    is ever shown, so no count can name who gave one. Expects c, an ItemCounts, or None. -#}
{% if c and c.loved %}
<p class="small item-feedback">{{ c.loved }} loved it</p>
{% endif %}
