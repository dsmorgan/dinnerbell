# Production: podman-compose pull && podman-compose up -d   (or: docker compose ...)
# Test instance: deploy/dinnerbell-test pull && deploy/dinnerbell-test up -d
#   (always through that script, never with -p or DINNERBELL_ENV_FILE by hand)
# Build from source: add -f compose.yaml -f compose.build.yaml. See docs/setup.md.
#
# Compose reads ${...} values from the shell and from .env in this directory, not from env_file.
services:
  dinnerbell:
    # Each release commit sets this default to its own version, so checking out tag vX.Y.Z runs
    # image X.Y.Z. Production never sets DINNERBELL_TAG; deploy/dinnerbell-test does.
    image: ghcr.io/dsmorgan/dinnerbell:${DINNERBELL_TAG:-0.4.0}
    env_file: ${DINNERBELL_ENV_FILE:-.env}
    ports:
      # Publish only on the interface your reverse proxy (Newt) reaches. Set DINNERBELL_BIND in .env.
      - "${DINNERBELL_BIND:-127.0.0.1}:${DINNERBELL_PORT:-8013}:8013"
    # Compose prefixes this name with the project name: dinnerbell_dinnerbell-data for a clone in
    # a directory named dinnerbell, and dinnerbell-test_dinnerbell-data for the test instance.
    volumes:
      - dinnerbell-data:/data
    read_only: true
    # Uploads spool to /tmp. The app caps request bodies at about 2 MB; the size cap here bounds
    # what concurrent uploads can take from memory.
    tmpfs:
      - /tmp:size=16m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    # Podman ignores an image HEALTHCHECK when it builds in OCI format, so declare it here too.
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import sys, urllib.request; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8013/healthz', timeout=4).status == 200 else 1)"
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

volumes:
  # {} rather than an empty value: podman-compose 1.5.0 and older can't merge an empty value with
  # deploy/compose.test.yaml's name.
  dinnerbell-data: {}
