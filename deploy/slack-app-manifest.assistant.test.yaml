# Dinnerbell Test Slack app manifest, for the test instance (ADR 0006), with the
# optional assistant (ADR 0009).
#
# Apply this in place of slack-app-manifest.test.yaml only when you turn the
# assistant on (DINNERBELL_ANTHROPIC_API_KEY and the assistant flag). It is
# slack-app-manifest.test.yaml plus a writable Messages tab, the im:history and
# app_mentions:read scopes, and the message.im and app_mention events, so
# members can message Dinnerbell and mention it in the channel. Paste it under
# App Manifest, then reinstall the app. See "The assistant" in
# docs/configuration.md.
#
# Create this as a second app in the same workspace as production. The two
# apps must never share tokens: Socket Mode delivers each event to only one
# connection, so a shared app token would split button taps between instances.
#
# Paste this file into api.slack.com/apps > Create New App > From a manifest.
# Don't edit this file in your clone. After you paste it, change
# dinnerbell-test.example.com in redirect_urls to your test hostname in Slack's
# manifest editor, before you select Next. The path must stay /auth/callback.
# To keep a copy with your hostname, write it to a *.local.yaml file, which git
# ignores. See docs/test-instance.md.

display_information:
  name: Dinnerbell Test
  description: Test instance of Dinnerbell. Runs unreleased builds against test data.
  background_color: "#4a4a4a"

features:
  app_home:
    # Members can message the assistant in the Messages tab.
    home_tab_enabled: true
    messages_tab_enabled: true
    messages_tab_read_only_enabled: false
  bot_user:
    display_name: dinnerbell-test
    always_online: false
  slash_commands:
    # Must match DINNERBELL_SLACK_COMMAND in .env.test. A workspace can't have
    # two apps with the same command, so test can't use /dinnerbell.
    - command: /dinnerbell-test
      description: Start, offer, log, or call off a test meal, see the schedule, or open your preferences
      usage_hint: "[call | offer | log | cancel | schedule | discard | prefs | catalog | history | version | help]"
      should_escape: false

oauth_config:
  redirect_urls:
    # Used by Sign in with Slack. Edit the hostname before you paste.
    - https://dinnerbell-test.example.com/auth/callback
  scopes:
    bot:
      - chat:write          # post calls, proposals, decisions, and recaps
      - channels:read       # check the bot is in the channel; list its members for the notification guard
      - groups:read         # the same for a private test channel
      - files:write         # upload the badge art PNGs (files.upload); never shared in a channel
      - im:write            # direct messages; also checks a DM button came from the member's own DM
      - users:read          # needed by users:read.email
      - users:read.email    # link members by email (users.lookupByEmail)
      - commands            # the /dinnerbell-test slash command
      - im:history          # read members' direct messages to Dinnerbell (the assistant)
      - app_mentions:read   # read messages that mention Dinnerbell (the assistant)
    user:
      # Sign in with Slack (OpenID Connect) for the web app.
      - openid
      - email
      - profile

settings:
  event_subscriptions:
    # No request_url: Socket Mode delivers events over the WebSocket.
    bot_events:
      - app_home_opened
      - message.im          # direct messages to Dinnerbell (the assistant)
      - app_mention         # mentions of Dinnerbell in the channel (the assistant)
  # Enables buttons, menus, and modals. No request_url in Socket Mode.
  interactivity:
    is_enabled: true
  org_deploy_enabled: false
  socket_mode_enabled: true
  token_rotation_enabled: false
